<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF6B00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <title>جزئیات غرفه</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <!-- هدر همانند index -->
  <header class="main-header">
    <div class="header-row-1">
      <div class="header-right">
        <img src="images/logo.png" alt="لوگو" class="logo">
        <div class="header-search-container">
          <i class="fas fa-search search-icon"></i>
          <input type="text" id="header-search-input" placeholder="جستجو...">
        </div>
      </div>
      <div class="header-left">
        <div class="nav-item categories-menu">
          <a href="#"><i class="fas fa-bars"></i> دسته‌بندی‌ها</a>
          <div class="mega-menu-container">
            <div class="main-categories-panel">
              <ul id="main-categories-list"></ul>
            </div>
            <div class="sub-categories-panel" id="sub-categories-display"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="header-row-2">
      <nav class="header-nav">
        <a href="#">کالاهای با تخفیف</a>
        <span class="nav-separator">|</span>
        <a href="#">عمده‌فروش‌ها</a>
        <a href="#">تک‌فروش‌ها</a>
      </nav>
      <div class="header-bottom-left">
        <div class="city-selector-container">
          <button id="city-selector-btn">
            <i class="fas fa-map-marker-alt"></i>
            <span id="selected-city-name">انتخاب شهر</span>
          </button>
        </div>
        <a href="login.html" class="btn-login">
          <i class="fas fa-user-circle"></i>
          <span>ورود | ثبت‌نام</span>
        </a>
      </div>
    </div>
  </header>

  <div class="container" id="shop-details-page-container">
    <nav id="breadcrumb" class="breadcrumb"></nav>

    <!-- هدر اطلاعات غرفه -->
    <section id="shop-header-section" class="shop-header"></section>

    <div class="shop-tabs">
      <nav class="shop-tabs-nav">
        <button id="tab-btn-home" class="shop-tab-btn active" aria-controls="tab-panel-home">
          <i class="fas fa-home"></i> خانه
        </button>
        <button id="tab-btn-products" class="shop-tab-btn" aria-controls="tab-panel-products">
          <i class="fas fa-shopping-bag"></i> محصولات
        </button>
        <button id="tab-btn-reviews" class="shop-tab-btn" aria-controls="tab-panel-reviews">
          <i class="fas fa-star"></i> نظرات کاربران
        </button>
      </nav>

      <!-- تب خانه -->
      <div id="tab-panel-home" class="shop-tab-content active">
        <img id="shop-banner-img" class="shop-home-banner" alt="بنر غرفه">

        <div class="card">
          <h3><i class="fas fa-info-circle"></i> درباره غرفه</h3>
          <p id="shop-description-text"></p>
          <p><strong>سابقه کاری:</strong> <span id="shop-experience"></span></p>
          <p><strong>شهر:</strong> <span id="shop-city"></span></p>
          <div id="contact-buttons"></div>
        </div>

        <div id="shop-location-box" class="card" style="display:none;">
          <h3><i class="fas fa-map-marker-alt"></i> موقعیت مکانی</h3>
          <div id="shop-map"></div>
          <p><strong>آدرس:</strong> <span id="shop-address-text"></span></p>
          <div class="map-buttons">
            <button id="route-btn" class="btn"><i class="fas fa-directions"></i> مسیریابی</button>
            <a id="open-in-maps" class="btn secondary" target="_blank" rel="noopener">باز کردن در نقشه</a>
          </div>
        </div>

        <div class="card">
          <h3><i class="fas fa-certificate"></i> محصولات منتخب</h3>
          <div id="home-featured-products" class="h-products"></div>
          <div style="text-align:center;margin-top:20px;">
            <button id="to-products" class="btn primary">نمایش همه محصولات</button>
          </div>
        </div>
      </div>

      <!-- تب محصولات -->
      <div id="tab-panel-products" class="shop-tab-content">
        <div class="product-controls card">
          <input id="productSearch" placeholder="جستجوی محصولات..." />
          <select id="sortSelect">
            <option value="recommended">پیشنهاد غرفه‌دار</option>
            <option value="newest">جدیدترین</option>
            <option value="discount">دارای تخفیف</option>
          </select>
        </div>
        <div id="productsGrid" class="products-grid"></div>
      </div>

      <!-- تب نظرات -->
      <div id="tab-panel-reviews" class="shop-tab-content">
        <div class="reviews-layout">
          <div class="rating-summary card">
            <h3>امتیاز کلی: <strong id="rating-value"></strong></h3>
            <div id="rating-dist"></div>
            <hr>
            <h4>نظر خود را ثبت کنید</h4>
            <input id="reviewerName" placeholder="نام شما" />
            <select id="reviewRate">
              <option value="5">۵ ستاره (عالی)</option>
              <option value="4">۴ ستاره (خوب)</option>
              <option value="3">۳ ستاره (متوسط)</option>
              <option value="2">۲ ستاره (ضعیف)</option>
              <option value="1">۱ ستاره (بد)</option>
            </select>
            <textarea id="reviewText" placeholder="متن نظر شما..."></textarea>
            <button id="submit-review" class="btn primary">ارسال نظر</button>
          </div>
          <div id="reviewsList" class="reviews-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ثبت سرویس‌ورکر -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    }
  </script>

  <script src="script.js"></script>
</body>
</html>
